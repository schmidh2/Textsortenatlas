name: Homepage-Variante synchronisieren

# Übernimmt automatisch jede Änderung von main in den Branch "homepage"
# (eigenes Design, gleiche Inhalte) und veröffentlicht sie zusätzlich im
# separaten Repo schmidh2/Textsortenatlas-Homepage, damit beide Seiten
# immer denselben Stand haben.
#
# Voraussetzung: Secret HOMEPAGE_SITE_TOKEN (Personal Access Token mit
# Schreibrechten auf schmidh2/Textsortenatlas-Homepage, Scope "repo"
# genügt) unter Settings → Secrets and variables → Actions anlegen.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-homepage
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken (Branch homepage, volle Historie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: homepage

      - name: main in homepage mergen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            git merge --abort
            echo "::error::Merge-Konflikt zwischen main und homepage. Bitte manuell lösen (z. B. Claude bitten, den Konflikt im Branch 'homepage' aufzulösen)."
            exit 1
          fi
          # .github/workflows gehört nicht zur Homepage-Variante (nur main
          # braucht die CI) und würde ohne "workflow"-Scope im PAT den
          # Cross-Repo-Push unten verhindern.
          if [ -d .github ]; then
            git rm -r --cached .github >/dev/null
            rm -rf .github
          fi
          git commit --no-edit

      - name: homepage-Branch zurückpushen
        run: git push origin homepage

      - name: Separates Homepage-Repo aktualisieren
        env:
          TOKEN: ${{ secrets.HOMEPAGE_SITE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret HOMEPAGE_SITE_TOKEN fehlt – kann schmidh2/Textsortenatlas-Homepage nicht aktualisieren."
            exit 1
          fi
          # actions/checkout hinterlegt einen Basic-Auth-Header für github.com
          # mit dem repo-eigenen GITHUB_TOKEN; der würde sonst den PAT unten
          # überschreiben. Für diesen Push explizit leeren.
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${TOKEN}@github.com/schmidh2/Textsortenatlas-Homepage.git" homepage:main
